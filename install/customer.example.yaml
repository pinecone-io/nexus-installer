# =============================================================================
# Nexus self-hosted install — inputs contract
# =============================================================================
# Fill this in ONCE. Every generated config file and every created secret derives
# from the values below. This is the single thing you edit.
#
# SECRETS ARE NEVER WRITTEN IN THIS FILE. Where a secret is needed you give the
# NAME of an environment variable that holds it (a *Env field) and export that
# variable in your shell before running the tools. The toolkit reads the value
# from the environment and never echoes it.
#
#   cp customer.example.yaml customer.yaml     # customer.yaml is gitignored
#   $EDITOR customer.yaml
#
# Each field carries a tag so you know what to do with it:
#   [YOURS]    supply from your environment — the values only you have.
#   [PINECONE] paste the value Pinecone hands you with the bundle; don't invent it.
#   [DEFAULT]  a working default — leave as-is unless you have a specific reason.
#   [OPTIONAL] can be skipped entirely (left off/empty by default).
#
# Example values use the placeholder org `acme` and the stem `acme`.
# Each field's trailing comment names exactly what it configures.
# =============================================================================

# --- Cluster access ----------------------------------------------------------
# The kubectl context the tools operate against. For AKS this is usually the
# cluster name after `az aks get-credentials`.
kubeContext: aks-acme-nexus              # [YOURS] kubectl context the tools run against

# --- Image registry: your registry -------------------------------------------
# The whole image bundle + the OCI chart live under one base path in your registry
# (`image-manifest.sh --list` prints exactly what must be present). `base` is that
# flat path and becomes the chart's global.image.registry (the single "where images
# come from" knob). `server`/`username`/`passwordEnv` build the pull Secret.
# Point `base` at a registry your cluster can pull from durably — i.e. your own mirror
# of the bundle. Do not point it straight at Pinecone's registry: those credentials are
# short-lived, so nodes would fail to re-pull (e.g. on reschedule) once the token expires.
registry:
  base: acmeacr.azurecr.io/pinecone      # [YOURS]   -> global.image.registry (flat: <base>/<name>:<tag>)
  server: acmeacr.azurecr.io             # [YOURS]   docker-server for the pull Secret
  username: acmeacr                      # [YOURS]   docker-username (for ACR, the registry name)
  passwordEnv: NEXUS_REGISTRY_PASSWORD   # [YOURS]   env var name holding the registry password (never the literal)
  pullSecretName: acr-pull               # [DEFAULT] name of the pull Secret to create + consume

# --- Image bundle ------------------------------------------------------------
# `tag` selects the release; Pinecone hands you the value — paste it, don't invent it.
# A promoted oci-stable-<id> (immutable) runs the whole stack at that ONE tag: you mirror a
# single tag per image and every pod runs it. A raw build id (main-<sha>) is the chart version
# suffix (0.0.0-bundle.<id>) and leaves each image on its baked tag. oci-stable-latest is
# discovery-only — it moves, so don't pin an install to it.
bundle:
  tag: oci-stable-<id>                    # [PINECONE] promoted immutable release id (couples the stack); paste what Pinecone gives you
  # The data plane BAKES these into the published OCI chart at build time and the
  # OCI install path cannot override them (see README "OCI vs local-chart path").
  # Pinecone ships these two values with the bundle. If your embedding dimension
  # or a freshly minted index id differ from these, preflight forces the
  # local-chart path automatically.
  bakedDimension: 1024                              # [PINECONE] shipped with the bundle; don't change
  bakedIndexId: 8fe737ee-67aa-47c4-b7b2-ed5ac39c552e  # [PINECONE] shipped with the bundle; don't change

# --- Static index ------------------------------------------------------------
# The one index the whole stack shares. Re-minting the id after data is ingested
# orphans it, so choose once. MINT A FRESH uuid per install (`uuidgen`) UNLESS you
# are on the OCI path, which must keep the baked id above (preflight enforces this).
staticIndex:
  id: 8fe737ee-67aa-47c4-b7b2-ed5ac39c552e   # [PINECONE] keep = bundle.bakedIndexId on OCI; mint fresh only on the local-chart path
  name: nexus-hybrid                          # [DEFAULT]  -> staticIndex.name
  # dimension is taken from embedding.dimension below (one source of truth).

# --- Object storage ----------------------------------------------------------
# provider: abs (Azure Blob, below), s3 (AWS), or gcs (GCP) — both further down. You
# pre-create the storage; tf-to-inputs.sh fills this block from the aks-slim / eks-slim /
# gke-slim outputs.
storage:
  provider: abs                          # [YOURS]   abs | s3 | gcs
  # --- provider: abs (Azure Blob) — seven containers from one stem (see README) ---
  account: acmenexusstore                # [YOURS]   -> blob.abs.account
  containerPrefix: acme                  # [YOURS]   -> blob.abs.containerPrefix; 7 containers:
                                         #            <stem>-db + <stem>-nexus-{source,knowledge,archive,traces,snapshots,library}
  auth: shared_key                       # [YOURS]   choose one: shared_key | workload_identity
  # --- shared_key only ---
  existingSecret: nexus-azure-storage    # [DEFAULT] k8s Secret name holding the account key (create-secrets.sh creates it)
  storageKeyEnv: NEXUS_STORAGE_KEY       # [DEFAULT] env var name holding the storage account key
  # --- workload_identity only ---
  clientId: ""                           # [YOURS]   user-assigned managed identity client id -> blob.abs.clientId
  # --- provider: s3 (AWS) — bucket-per-store, keyless IRSA (delete the abs keys above) ---
  # provider: s3
  # bucketPrefix: acme-abc123            # [YOURS]  stem: <prefix>-db + six <prefix>-nexus-* -> blob.s3.bucketPrefix
  # region: us-east-1                    # [YOURS]  bucket region -> blob.s3.region (the AWS SDK has no default)
  # roleArn: arn:aws:iam::<acct>:role/<role>   # [YOURS] IRSA role every blob-accessing SA assumes
  # --- provider: gcs (GCP) — bucket-per-store, keyless Workload Identity (delete the abs keys above) ---
  # Needs a bundle whose chart includes GCS support; an older chart's values.schema.json permits
  # only local/abs/s3 and helm rejects provider: gcs at dry-run. Use the bundle Pinecone gives you.
  # provider: gcs
  # bucketPrefix: acme-abc123            # [YOURS]  stem: <prefix>-db + six <prefix>-nexus-* -> blob.gcs.bucketPrefix
  # serviceAccount: nexus-blob@<project>.iam.gserviceaccount.com   # [YOURS] GSA every blob-accessing SA impersonates -> blob.gcs.serviceAccount
  # project: my-gcp-project              # [YOURS]  GCP project holding the buckets + GSA -> blob.gcs.project

# --- Model endpoints (OpenAI-compatible: Azure OpenAI + Azure AI Foundry) -----
# The proxy validates every model id against LiteLLM's registry at startup, so each must
# be one LiteLLM maps: chat `gpt-5`, embedding `text-embedding-3-small`, rerank
# `<rerankProvider>/<rerankDeployment>` (below). Keys are env-var references injected via
# --set at install (never written to a values file).
inference:
  endpoint: https://acme-aoai.cognitiveservices.azure.com        # [YOURS]   chat + embedding base_url
  rerankEndpoint: https://acme-aoai.services.ai.azure.com/providers/cohere  # [YOURS] Foundry Cohere rerank base_url
  chatDeployment: gpt-5                  # [YOURS]   your deployment; name must be router-recognized (e.g. gpt-5)
  embeddingDeployment: text-embedding-3-small  # [YOURS] your deployment; recommended text-embedding-3-small
  # rerankProvider picks the LiteLLM route; rerankDeployment must be BOTH a LiteLLM-mapped
  # model id and your Foundry deployment name:
  #   azure_ai [DEFAULT] model `azure_ai/<rerankDeployment>` — LiteLLM's canonical name
  #            (cohere-rerank-v4.0-fast) runs the current Cohere reranker; base -> /v2/rerank.
  #   cohere   alternative: model `cohere/<rerankDeployment>` — the older rerank-v3.5. A
  #            newer name LiteLLM can't map (rerank-v4.0-fast) fails startup, so 4.x needs azure_ai.
  rerankProvider: azure_ai               # [DEFAULT] azure_ai | cohere
  rerankDeployment: cohere-rerank-v4.0-fast  # [YOURS] your Foundry deployment; must match rerankProvider (see above)
  llmKeyEnv: NEXUS_LLM_KEY               # [DEFAULT] env var name holding the chat key
  embeddingKeyEnv: NEXUS_LLM_KEY         # [DEFAULT] env var name holding the embedding key (often the same AOAI key)
  rerankKeyEnv: NEXUS_RERANK_KEY         # [DEFAULT] env var name holding the rerank key

  # --- [OPTIONAL] Reach chat + embedding through an internal API gateway -----
  # For a provider with no static key and no public network path, where every call
  # goes through an API-management front door instead. Uncomment the block and:
  #   - `endpoint` above becomes the GATEWAY base (the part before /deployments/...),
  #     e.g. https://gateway.dev.acme.com/df/genai/sit
  #   - llmKeyEnv / embeddingKeyEnv become unused: the per-request credential is an
  #     OAuth2 token the inference proxy mints and refreshes itself. What you supply
  #     is the long-lived client id/secret behind it.
  #   - rerank is unaffected and still uses rerankEndpoint + rerankKeyEnv.
  # Verify it before installing: python3 preflight.py --live-gateway
  #
  # gateway:
  #   tokenUrl: https://acme.okta.com/oauth2/aus1abc/v1/token   # [YOURS] token endpoint
  #   clientIdEnv: NEXUS_GATEWAY_CLIENT_ID                      # [YOURS] env var holding the client id
  #   clientSecretEnv: NEXUS_GATEWAY_CLIENT_SECRET              # [YOURS] env var holding the client secret
  #   scope: genai.invoke                    # [OPTIONAL] omit if your client needs no scope
  #   clientAuth: basic                      # [DEFAULT] basic | post -- how the client authenticates to the token endpoint
  #   subscriptionKeyEnv: NEXUS_GATEWAY_SUBSCRIPTION_KEY  # [OPTIONAL] env var holding the gateway's own key
  #   subscriptionHeader: Ocp-Apim-Subscription-Key       # [DEFAULT] header that key travels in
  #   apiVersion: 2025-01-01-preview         # [OPTIONAL] sent as the ?api-version= query param
  #
  # Gateway-path only: the proxy cannot introspect the deployment's limits when it
  # talks to a gateway, so state them. Defaults below suit a gpt-5-class deployment;
  # they must not exceed what your deployment actually allows.
  # contextWindow: 272000                    # [DEFAULT] chat model context window
  # maxOutputTokens: 16384                   # [DEFAULT] chat model max output tokens

# --- Embedding dimension (THE consistency lynchpin) --------------------------
# One value feeds staticIndex.dimension, nexus.config.indexMetadata.dimension, and
# nexus.config.embeddingModel.dimension, and it must equal the width the embedding
# model actually emits. A value that differs from bundle.bakedDimension forces the
# local-chart path.
#
# text-embedding-3-small emits 1536 natively, but it is a Matryoshka model: set
# requestDimensions: true and the proxy asks it for `dimension`-wide (1024) vectors
# instead. That keeps the target at the chart's baked 1024 so the OCI path works for
# the recommended model with no re-mint. (Needs a bundle whose inference proxy honors
# the dimensions request; older bundles only support a natively-1024
# model such as multilingual-e5-large.)
embedding:
  dimension: 1024                # [DEFAULT] recommended 1024 (must equal what the model emits; see above)
  # [DEFAULT] Ask a Matryoshka model to emit `dimension`-wide vectors. Leave unset and the
  # generator defaults it on for a text-embedding-3-* model; set it explicitly to
  # force on/off (e.g. false for a model whose native width already equals dimension).
  requestDimensions: true

# --- Ingress (exposure — you wire the controller / DNS / TLS) ----------------
# [OPTIONAL] Off by default: the gateway stays ClusterIP and you expose it later.
ingress:
  enabled: false                         # [OPTIONAL] false = gateway stays ClusterIP
  className: ""                          # [OPTIONAL] IngressClass; empty = cluster default
  host: ""                               # [OPTIONAL] e.g. nexus.internal.acme.example
  tlsSecretName: ""                      # [OPTIONAL] a TLS Secret YOU create; empty = no TLS block

# --- Host branding -----------------------------------------------------------
host:
  name: Nexus                            # [DEFAULT]  -> nexus.config.host.name
  url: ""                                # [OPTIONAL] -> nexus.config.host.url; empty derives https://<ingress.host>

# --- Azure identifiers -------------------------------------------------------
# [OPTIONAL] Only used by `preflight.py --live` for the cloud-side checks.
azure:
  subscription: ""                       # [OPTIONAL] subscription id or name
  resourceGroup: ""                      # [OPTIONAL] RG holding the cluster + storage account
  aoaiResourceGroup: ""                  # [OPTIONAL] RG holding the Azure OpenAI account
