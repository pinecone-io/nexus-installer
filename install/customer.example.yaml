# =============================================================================
# Nexus self-hosted install — inputs contract
# =============================================================================
# Fill this in ONCE. Every generated config file and every created secret derives
# from the values below. This is the single thing you edit.
#
# SECRETS ARE NEVER WRITTEN IN THIS FILE. Where a secret is needed you give the
# NAME of an environment variable that holds it (a *Env field) and export that
# variable in your shell before running the tools. The toolkit reads the value
# from the environment and never echoes it.
#
#   cp customer.example.yaml customer.yaml     # customer.yaml is gitignored
#   $EDITOR customer.yaml
#
# Each field carries a tag so you know what to do with it:
#   [YOURS]    supply from your environment — the values only you have.
#   [PINECONE] paste the value Pinecone hands you with the bundle; don't invent it.
#   [DEFAULT]  a working default — leave as-is unless you have a specific reason.
#   [OPTIONAL] can be skipped entirely (left off/empty by default).
#
# Example values use the placeholder org `acme` and the stem `acme`.
# Each field's trailing comment names exactly what it configures.
# =============================================================================

# --- Cluster access ----------------------------------------------------------
# The kubectl context the tools operate against. For AKS this is usually the
# cluster name after `az aks get-credentials`.
kubeContext: aks-acme-nexus              # [YOURS] kubectl context the tools run against

# --- Image registry: your registry -------------------------------------------
# The whole image bundle + the OCI chart live under one base path in your registry
# (`image-manifest.sh --list` prints exactly what must be present). `base` is that
# flat path and becomes the chart's global.image.registry (the single "where images
# come from" knob). `server`/`username`/`passwordEnv` build the pull Secret.
# Point `base` at a registry your cluster can pull from durably — i.e. your own mirror
# of the bundle. Do not point it straight at Pinecone's registry: those credentials are
# short-lived, so nodes would fail to re-pull (e.g. on reschedule) once the token expires.
registry:
  base: acmeacr.azurecr.io/pinecone      # [YOURS]   -> global.image.registry (flat: <base>/<name>:<tag>)
  server: acmeacr.azurecr.io             # [YOURS]   docker-server for the pull Secret
  username: acmeacr                      # [YOURS]   docker-username (for ACR, the registry name)
  passwordEnv: NEXUS_REGISTRY_PASSWORD   # [YOURS]   env var name holding the registry password (never the literal)
  pullSecretName: acr-pull               # [DEFAULT] name of the pull Secret to create + consume

# --- Image bundle ------------------------------------------------------------
# `tag` selects the release; Pinecone hands you the value — paste it, don't invent it.
# A promoted oci-stable-<id> (immutable) runs the whole stack at that ONE tag: you mirror a
# single tag per image and every pod runs it; the chart is 0.0.0-bundle.oci-stable-<id>.
# oci-stable-latest is discovery-only — it moves, so don't pin an install to it.
# To upgrade, this is the only line you change (see README "Upgrading").
bundle:
  tag: oci-stable-<id>                    # [PINECONE] promoted immutable release id (couples the stack); paste what Pinecone gives you

# --- Sizing ------------------------------------------------------------------
sizing: small                            # [DEFAULT] the only supported class

# --- Static index ------------------------------------------------------------
# The one index the whole stack shares. Mint the id ONCE per install (`uuidgen`) and
# never change it afterwards — every stored document is keyed to it.
staticIndex:
  id: <uuidgen>                               # [YOURS]    mint once with `uuidgen`; immutable after install
  name: nexus-hybrid                          # [DEFAULT]  -> global.staticIndex.name
  # dimension is taken from embedding.dimension below (one source of truth).

# --- Object storage ----------------------------------------------------------
# provider: abs (Azure Blob, below), s3 (AWS), or gcs (GCP) — the other two further down. You
# pre-create the storage; tf-to-inputs.sh fills this block from the aks-slim / eks-slim /
# gke-slim outputs.
storage:
  provider: abs                          # [YOURS]   abs | s3 | gcs
  # --- provider: abs (Azure Blob) — seven containers from one stem (see README) ---
  account: acmenexusstore                # [YOURS]   -> blob.abs.account
  containerPrefix: acme                  # [YOURS]   -> blob.abs.containerPrefix; 7 containers:
                                         #            <stem>-db + <stem>-nexus-{source,knowledge,archive,traces,snapshots,library}
  auth: shared_key                       # [YOURS]   choose one: shared_key | workload_identity
  # --- shared_key only ---
  existingSecret: nexus-azure-storage    # [DEFAULT] k8s Secret name holding the account key (create-secrets.sh creates it)
  storageKeyEnv: NEXUS_STORAGE_KEY       # [DEFAULT] env var name holding the storage account key
  # --- workload_identity only ---
  clientId: ""                           # [YOURS]   user-assigned managed identity client id -> blob.abs.clientId
  # --- provider: s3 (AWS) — bucket-per-store, keyless IRSA (delete the abs keys above) ---
  # provider: s3
  # bucketPrefix: acme-abc123            # [YOURS]  stem: <prefix>-db + six <prefix>-nexus-* -> blob.s3.bucketPrefix
  # region: us-east-1                    # [YOURS]  bucket region -> blob.s3.region (the AWS SDK has no default)
  # roleArn: arn:aws:iam::<acct>:role/<role>   # [YOURS] IRSA role every blob-accessing SA assumes
  # --- provider: gcs (GCP) — bucket-per-store, keyless Workload Identity (delete the abs keys above) ---
  # Needs a bundle whose chart includes GCS support; an older chart's values.schema.json permits
  # only local/abs/s3 and helm rejects provider: gcs at dry-run. Use the bundle Pinecone gives you.
  # provider: gcs
  # bucketPrefix: acme-abc123            # [YOURS]  stem: <prefix>-db + six <prefix>-nexus-* -> blob.gcs.bucketPrefix
  # serviceAccount: nexus-blob@<project>.iam.gserviceaccount.com   # [YOURS] GSA every blob-accessing SA impersonates -> blob.gcs.serviceAccount
  # project: my-gcp-project              # [YOURS]  GCP project holding the buckets + GSA -> blob.gcs.project

# --- Model endpoints ---------------------------------------------------------
# Three surfaces, configured independently: llm (chat), embedding, rerank. Each names the
# host, the provider that routes it, the model, and the env var holding its key — so they
# can sit on different providers entirely. `apiStyle: litellm` addresses the model through
# LiteLLM, which must map `<provider>/<deployment>` to a model of the right kind;
# `apiStyle: openai` treats the host as plain OpenAI-compatible and looks nothing up.
# `python3 preflight.py` checks the result whichever you pick; `--live-models` then calls
# each model once, so a bad host, key or model name fails here rather than at first use.
inference:
  llm:
    endpoint: https://acme-aoai.cognitiveservices.azure.com   # [YOURS] chat host
    provider: azure                      # [DEFAULT] LiteLLM provider prefixing the model id ("" = the id needs none)
    deployment: gpt-5                    # [YOURS]   the chat model, used by every tier not overridden below
    keyEnv: NEXUS_LLM_KEY                # [DEFAULT] env var name holding the chat key
    # [OPTIONAL] apiStyle: litellm | openai — defaults to openai when the gateway block
    # below is set, litellm otherwise.
    # [OPTIONAL] Which family's request quirks the model needs: gpt5 | claude. The proxy
    # infers it from the model id, and most models have no family and need none — set it
    # only when the name HIDES one (a deployment called `chat-prod` fronting a gpt-5
    # model), or every tool-using call fails at runtime.
    # modelFamily: gpt5
    # [OPTIONAL] Chat token budgets. Under apiStyle: litellm they come from LiteLLM's
    # registry entry for the model and a value here can only TIGHTEN that — a larger one is
    # clamped back down. They become REQUIRED when the registry does not know the id, since
    # nothing fills them then and the proxy will not start. Under apiStyle: openai nothing is
    # looked up, so the generator writes the values below as-is: state what your deployment
    # actually allows rather than leaving a default that overstates it.
    # contextWindow: 272000
    # maxOutputTokens: 16384
    # [OPTIONAL] The proxy serves three chat tiers: lite, standard and pro. Leave `tiers`
    # out and all three run everything above — same model, host, provider and key.
    #
    # Name a tier to override just the settings it lists; the rest still come from the
    # block above. Usually that is only the model — three deployments on the one host,
    # cheapest first:
    # tiers:
    #   lite:     {deployment: gpt-5.6-luna}
    #   standard: {deployment: gpt-5}
    #   pro:      {deployment: gpt-5.6-terra}
    #
    # A tier can differ in more than the model, including its credential — one naming its
    # own keyEnv gets its own, injected like the others:
    # tiers:
    #   lite:     {deployment: gpt-5.6-luna}
    #   standard: {deployment: gpt-5}
    #   pro:
    #     deployment: gpt-5.6-terra
    #     endpoint: https://acme-aoai-pro.cognitiveservices.azure.com
    #     keyEnv: NEXUS_PRO_KEY
    #
    # Or on another vendor entirely, where the model needs its family named:
    # tiers:
    #   pro:
    #     provider: anthropic
    #     deployment: claude-sonnet-4-5
    #     endpoint: https://api.anthropic.com
    #     keyEnv: NEXUS_PRO_KEY
    #     modelFamily: claude
    #     maxOutputTokens: 64000

  embedding:
    endpoint: https://acme-aoai.cognitiveservices.azure.com   # [YOURS] embedding host
    provider: azure                      # [DEFAULT] LiteLLM provider prefixing the model id
    deployment: text-embedding-3-small    # [YOURS]  the embedding model
    keyEnv: NEXUS_LLM_KEY                # [YOURS] env var name holding the embedding key; shared with chat here only because both sit on the one resource
    # [OPTIONAL] apiStyle: litellm | openai — defaults to openai when the gateway block
    # below is set, litellm otherwise.
    # [OPTIONAL] Per-request ceilings the proxy enforces; lower them for a tighter model.
    # limits: {maxInputChars: 8000, maxBatchSize: 96}

  rerank:
    # Its own provider, independent of the two above. Any that issues an API key works;
    # ones that sign with cloud credentials (bedrock, vertex_ai) are refused, because the
    # proxy has nowhere to hold those.
    #   azure_ai [DEFAULT] a reranker on a host of yours; NEEDS `endpoint`, whose base is
    #            pinned to /v2/rerank (LiteLLM would send a bare base to /v1).
    #   cohere / voyage / jina_ai / nvidia_nim / ... publish one endpoint for everyone —
    #            leave `endpoint` out and LiteLLM addresses the provider itself.
    #   ""       no prefix, when `deployment` is already a full LiteLLM id.
    provider: azure_ai                   # [DEFAULT] any LiteLLM rerank provider that takes an API key
    deployment: cohere-rerank-v4.0-fast  # [YOURS]   the rerank model under that provider
    endpoint: https://acme-aoai.services.ai.azure.com/providers/cohere  # [OPTIONAL] required for azure_ai
    keyEnv: NEXUS_RERANK_KEY             # [DEFAULT] env var name holding the rerank key
    # [OPTIONAL] limits: {maxQueryChars: 1000, maxDocChars: 800, maxDocsPerRequest: 100}

  # The earlier flat spelling still works and means the same thing, so an inputs file
  # written against it keeps generating the same catalog. All of these sit directly under
  # `inference:`, as siblings of the three blocks above:
  #   endpoint (chat + embedding), chatBaseUrl, embeddingBaseUrl, rerankEndpoint,
  #   chatDeployment, embeddingDeployment, rerankDeployment, provider, rerankProvider,
  #   providerLabel, apiStyle, chatApiStyle, embeddingApiStyle, modelFamily,
  #   contextWindow, maxOutputTokens, embeddingLimits, rerankLimits,
  #   llmKeyEnv, embeddingKeyEnv, rerankKeyEnv

  # --- [OPTIONAL] Reach chat + embedding through an internal API gateway -----
  # For a provider with no static key and no public network path, where every call
  # goes through an API-management front door instead. Uncomment the block and:
  #   - the llm and embedding `endpoint`s above become the GATEWAY base (the part before
  #     /deployments/..., which the generator appends), e.g. https://gateway.acme.com/genai
  #   - their `keyEnv`s become unused: the inference proxy authenticates with an OAuth2
  #     client-credentials grant (RFC 6749 §4.4), using the long-lived client id/secret
  #     you supply below.
  #   - their `apiStyle` defaults to openai, since a gateway fronts the deployment under a
  #     path of its own that no registry maps. So state the chat token budgets above —
  #     nothing looks them up on this path.
  #   - rerank keeps its own `endpoint` + `keyEnv` by DEFAULT. Set coversRerank: true
  #     (below) to front rerank through the gateway too, so its token auto-refreshes like
  #     chat/embedding (rerank's `keyEnv` then unused). Only if the gateway fronts rerank.
  # Verify it before installing: python3 preflight.py --live-gateway
  #
  # gateway:
  #   tokenUrl: https://acme.okta.com/oauth2/aus1abc/v1/token   # [YOURS] token endpoint
  #   clientIdEnv: NEXUS_GATEWAY_CLIENT_ID                      # [YOURS] env var holding the client id
  #   clientSecretEnv: NEXUS_GATEWAY_CLIENT_SECRET              # [YOURS] env var holding the client secret
  #     Basic client authentication base64s the credentials as-is (the ecosystem convention), so prefer URL-safe characters in the secret.
  #   scope: genai.invoke                    # [YOURS] REQUIRED — a token request with no scope is refused (400 invalid_scope)
  #   clientAuth: basic                      # [DEFAULT] basic | post -- how the client authenticates to the token endpoint
  #   subscriptionKeyEnv: NEXUS_GATEWAY_SUBSCRIPTION_KEY  # [OPTIONAL] env var holding the gateway's own key
  #   subscriptionHeader: Ocp-Apim-Subscription-Key       # [DEFAULT] header that key travels in
  #   apiVersion: 2025-01-01-preview         # [YOURS] REQUIRED — sent as the ?api-version= query param on every call
  #   coversRerank: false                    # [DEFAULT] false = rerank keeps its own endpoint + keyEnv; true = rerank rides the gateway credential (minted, auto-refreshed token). Enable only if the gateway actually fronts your rerank route.

# --- Embedding dimension (THE consistency lynchpin) --------------------------
# One value feeds global.staticIndex.dimension, nexus.config.indexMetadata.dimension,
# nexus.config.embeddingModel.dimension and the catalog's embedding entry, and it must
# equal the width the embedding model actually emits. The index bakes it at creation, so
# it is fixed from then on.
#
# Some models can narrow on request: they emit a wide vector natively but return a
# `dimension`-wide one when asked (OpenAI's text-embedding-3-* truncate and renormalize).
# requestDimensions turns that on, so a wider model can still hit the width you declare.
# Leave it off for a model whose native width already equals `dimension`, or one that
# cannot narrow — then set `dimension` to what it emits.
# `python3 preflight.py --live-models` measures the width the model actually returns.
embedding:
  dimension: 1024                # [YOURS] must equal what the model emits (see above)
  requestDimensions: true        # [YOURS] REQUIRED, no default: true asks the model for `dimension`-wide vectors (needs a bundle whose proxy honors it), false takes its native width

# --- Ingress (exposure — you wire the controller / DNS / TLS) ----------------
# [OPTIONAL] Off by default: the gateway stays ClusterIP and you expose it later.
ingress:
  enabled: false                         # [OPTIONAL] false = gateway stays ClusterIP
  className: ""                          # [OPTIONAL] IngressClass; empty = cluster default
  host: ""                               # [OPTIONAL] e.g. nexus.internal.acme.example
  tlsSecretName: ""                      # [OPTIONAL] a TLS Secret YOU create; empty = no TLS block

# --- Host branding -----------------------------------------------------------
host:
  name: Nexus                            # [DEFAULT]  -> nexus.config.host.name
  url: ""                                # [OPTIONAL] -> nexus.config.host.url; empty derives https://<ingress.host>

# --- Security ----------------------------------------------------------------
# The chart restricts ingress to nexus-api to the gateway (nexus-api trusts a
# gateway-injected identity), and a post-install hook verifies the cluster actually
# ENFORCES that NetworkPolicy — failing the install if a non-gateway pod can reach
# nexus-api. Enforcement needs a cluster policy engine; AKS defaults to
# --network-policy none, which admits the policy but does not enforce it.
security:
  # [DEFAULT] Leave true. Set false ONLY on a cluster with no policy engine, where
  # equivalent isolation is enforced at a lower layer — it skips the verification hook
  # (the NetworkPolicy object is still created).
  networkPolicyEnforcementCheck: true

# --- Azure identifiers -------------------------------------------------------
# [OPTIONAL] Only used by `preflight.py --live` for the cloud-side checks.
azure:
  subscription: ""                       # [OPTIONAL] subscription id or name
  resourceGroup: ""                      # [OPTIONAL] RG holding the cluster + storage account
  aoaiResourceGroup: ""                  # [OPTIONAL] RG holding the Azure OpenAI account
